[project]
name = "ampp"
version = "0.1.0"
description = "Autonomous Mathematical Proof Pipeline – Python components"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naitik Gupta" }]
requires-python = ">=3.11"
keywords = ["mathematics", "proof", "formal-verification", "lean", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
    "z3-solver>=4.12",
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["ampp*"]
exclude = ["crates*", "target*", "tests*"]
