[project]
name = "ampp"
version = "0.1.1"
description = "Autonomous Mathematical Proof Pipeline – Python components"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naitik Gupta" }]
requires-python = ">=3.11"
keywords = ["mathematics", "proof", "formal-verification", "lean", "ai", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.13",
    "z3-solver>=4.13",
    "pydantic>=2.7",
    "openai>=1.40",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "python-dotenv>=1.0",
    "ruff>=0.11",
    "pyright>=1.1.400",
    "build>=1.2",
    "setuptools>=68",
    "wheel",
]

[project.scripts]
ampp-worker = "ampp.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["ampp*"]
exclude = ["crates*", "target*", "tests*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["ampp"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
