name: CI

on:
  push:
    branches: [main, dev, 'improve/**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]

env:
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  AMPP_LLM_PROVIDER: 'null'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -e '.[dev]'
      - run: ruff check ampp tests
      - run: ruff format --check ampp tests
      - run: pyright ampp
      - run: python -m pytest tests/python -q --cov=ampp --cov-report=xml
      - run: python -m build

  integration:
    name: Real Lean and offline integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Install pinned Lean toolchain
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          echo "AMPP_LEAN_BINARY=$("$HOME/.elan/bin/elan" which lean)" >> "$GITHUB_ENV"
      - run: cargo build --workspace --locked
      - name: Test checker and actual Rust/Python/SQLite/Lean pipeline
        run: |
          python -m pytest tests/python/test_verification_policy.py -q
          AMPP_BIN=target/debug/ampp python -m pytest tests/integration -q
