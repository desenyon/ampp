name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust ─────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ampp-linux-x86_64
          path: target/release/ampp

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ampp-macos-arm64
          path: target/release/ampp

  # ── Python ───────────────────────────────────────────────────────────────────
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ampp/ tests/

      - name: Type-check (pyright)
        run: |
          pip install pyright
          pyright ampp/ || true   # advisory only until stubs are complete

      - name: Run tests
        run: pytest tests/python/ -v --tb=short --cov=ampp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Integration smoke test ───────────────────────────────────────────────────
  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: [rust, python]

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: ampp-linux-x86_64
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: pip install -e .

      - name: Smoke test (no LLM keys — proposer returns stubs)
        run: |
          chmod +x ampp
          ./ampp --problem "For all integers n >= 1, the sum 1+2+...+n equals n*(n+1)/2" \
                 --max-iter 5 \
                 --python python3 \
                 --worker ampp/worker.py \
                 --output /tmp/ampp_smoke

      - name: Verify output artefacts exist
        run: |
          ls /tmp/ampp_smoke/
          test -f /tmp/ampp_smoke/run_manifest.json
          test -f /tmp/ampp_smoke/solution.md
