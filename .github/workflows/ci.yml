name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"] # also run full CI on release tags
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust ─────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (macos-latest)
    runs-on: macos-latest
    strategy:
      matrix:
        toolchain: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all

  # ── Python ───────────────────────────────────────────────────────────────────
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ampp/ tests/

      - name: Type-check (pyright)
        run: |
          pip install pyright
          pyright ampp/ || true   # advisory only until stubs are complete

      - name: Run tests
        run: pytest tests/python/ -v --tb=short --cov=ampp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Integration smoke test ───────────────────────────────────────────────────
  integration:
    name: Integration smoke test
    runs-on: macos-latest
    needs: [rust, python]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: macos-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: pip install -e .

      - name: Smoke test (no LLM keys — proposer returns stubs)
        run: |
          ./target/release/ampp \
            --problem "For all integers n >= 1, the sum 1+2+...+n equals n*(n+1)/2" \
            --max-iter 5 \
            --python python3 \
            --worker ampp/worker.py \
            --output /tmp/ampp_smoke

      - name: Verify output artefacts exist
        run: |
          ls /tmp/ampp_smoke/
          test -f /tmp/ampp_smoke/run_manifest.json
          test -f /tmp/ampp_smoke/solution.md
